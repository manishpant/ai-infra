name: Terraform Self-Heal Fmt Only

'on':
  push:
    branches:
      - '**'
  pull_request:

jobs:
  # Job 1: probe fails (red) when drift exists; emit (always) still writes outputs for Job 2.
  # Do not use continue-on-error here — you want a real failed check when fmt is dirty.
  terraform-fmt-detect:
    name: Terraform fmt detect
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && !startsWith(github.ref_name, 'terraform-fmt-auto-heal/')) ||
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'terraform-fmt-auto-heal/'))
    permissions:
      contents: read
    outputs:
      needs_format: ${{ steps.emit.outputs.needs_format }}
      fmt_status: ${{ steps.emit.outputs.fmt_status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: terraform fmt --check (detect drift)
        id: probe
        run: |
          set +e
          terraform fmt --check --recursive . > /tmp/fmt_output.txt 2>&1
          fmt_status=$?
          echo "$fmt_status" > /tmp/fmt_status.txt
          set -e
          echo "terraform fmt --check exit code: $fmt_status (0 = clean, non-zero = drift)"
          cat /tmp/fmt_output.txt
          exit "$fmt_status"

      - name: Record outputs + detect job summary
        id: emit
        if: always()
        run: |
          fmt_status="$(cat /tmp/fmt_status.txt 2>/dev/null || echo 0)"
          if [[ "$fmt_status" != "0" ]]; then
            echo "needs_format=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_format=false" >> "$GITHUB_OUTPUT"
          fi
          echo "status=$fmt_status" >> "$GITHUB_OUTPUT"

          {
            echo "## Job 1 — Terraform fmt detect"
            echo ""
            echo "_When drift exists, **this job is intentionally failed** (red) on the probe step. Job 2 may still run and fix formatting; the workflow can remain red until you merge or push a clean commit — that is normal._"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            if [[ "$fmt_status" -ne 0 ]]; then drift_cell="**yes**"; next_cell="**Job 2 — Terraform fmt heal** runs (Claude + optional PR/merge)."; else drift_cell="**no**"; next_cell="Heal job skipped — branch is fmt-clean."; fi
            echo "| Drift detected | ${drift_cell} |"
            echo "| Exit code | \`${fmt_status}\` |"
            echo "| Next | ${next_cell} |"
            echo ""
            echo "<details><summary>Full \`terraform fmt --check\` output</summary>"
            echo ""
            echo '```text'
            cat /tmp/fmt_output.txt 2>/dev/null || echo "(no output file)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # Job 2: only when Job 1 saw drift — Claude, re-check, PR/merge, full summary.
  terraform-fmt-heal:
    name: Terraform fmt heal (Claude)
    runs-on: ubuntu-latest
    needs: terraform-fmt-detect
    if: always() && needs.terraform-fmt-detect.outputs.needs_format == 'true'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Recreate initial fmt log for summary scripts
        id: fmt_check_initial
        run: |
          set +e
          terraform fmt --check --recursive . > /tmp/fmt_output.txt 2>&1
          fmt_status=$?
          echo "status=$fmt_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture fmt errors and affected files
        id: fmt_context
        run: |
          python3 scripts/fmt_error_parser.py \
            --terraform-dir . \
            --output /tmp/fmt_context.json

      - name: Install Python dependencies (Anthropic SDK)
        run: python3 -m pip install --disable-pip-version-check 'anthropic>=0.40.0'

      - name: Call Claude for auto-heal
        id: claude_heal
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/claude_heal.py \
            --context-file /tmp/fmt_context.json \
            --output-dir . \
            --max-retries 2 \
            --report /tmp/claude_heal_report.json

      - name: Re-run terraform fmt --check (after heal)
        id: fmt_check_final
        continue-on-error: true
        run: |
          set +e
          terraform fmt --check --recursive . > /tmp/fmt_final.txt 2>&1
          fmt_status=$?
          echo "status=$fmt_status" >> "$GITHUB_OUTPUT"
          set -e
          cat /tmp/fmt_final.txt
          exit 0

      - name: Fmt gate — fail job if still not formatted after heal
        if: steps.fmt_check_final.outputs.status != '0'
        run: |
          echo "::error::terraform fmt --check still failing after heal (exit code ${{ steps.fmt_check_final.outputs.status }})."
          exit 1

      - name: Open PR with healed formatting (push only)
        id: open_pr
        if: |
          steps.fmt_check_final.outputs.status == '0' &&
          github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PR_CREATE_TOKEN || github.token }}
          AUTO_MERGE_HEAL_PR: ${{ vars.AUTO_MERGE_HEAL_PR != '' && vars.AUTO_MERGE_HEAL_PR || 'true' }}
          BASE_BRANCH: ${{ github.ref_name }}
          HEAL_BRANCH: terraform-fmt-auto-heal/run-${{ github.run_id }}-${{ github.run_attempt }}
          COMMIT_MSG: '[AUTO-HEAL] Fix Terraform formatting'
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/publish_auto_heal.sh

      - name: Log outcome
        if: steps.fmt_check_final.outputs.status == '0'
        run: |
          echo "✓ terraform fmt --check passed after heal."
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "See Job 2 Summary for PR / merge and Claude details."
          else
            echo "See Job 2 Summary (no auto-PR on pull_request)."
          fi

      - name: Persist metadata for job summary
        if: always()
        run: |
          echo '${{ needs.terraform-fmt-detect.outputs.fmt_status }}' > /tmp/meta_fmt_initial.txt
          echo '${{ steps.fmt_check_final.outputs.status }}' > /tmp/meta_fmt_final.txt
          echo '${{ steps.claude_heal.outcome }}' > /tmp/meta_claude_outcome.txt
          echo '${{ steps.open_pr.outcome }}' > /tmp/meta_open_pr_outcome.txt

      - name: Write job summary (heal)
        if: always()
        run: |
          {
            echo "## Job 2 — Terraform fmt heal"
            echo ""
            echo "_Detect job exit code was \`${{ needs.terraform-fmt-detect.outputs.fmt_status }}\` (drift)._"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          bash scripts/write_job_summary.sh
